<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18372b">
  <meta name="description" content="ClashVault — your Clash of Clans companion for player lookup, base ideas, attack guides and village progress.">
  <title>ClashVault — Your Kingdom Companion</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="home">
    <section class="section" id="player-finder">
      <h2>Player Finder</h2>
      <form id="playerSearchForm" class="search-form">
        <label class="sr-only" for="playerTag">Player tag</label>
        <input id="playerTag" maxlength="15" placeholder="Enter player tag" autocomplete="off">
        <button type="submit">Search player</button>
      </form>
      <p id="playerSearchMessage" aria-live="polite"></p>
      <div id="playerResult" hidden></div>
    </section>
    <section class="section" id="bases">
      <h2>Base Library</h2>
      <div id="baseFilters"></div>
      <div id="baseGrid"></div>
    </section>
    <section class="section" id="attacks">
      <h2>Attack Academy</h2>
    </section>
    <section class="section" id="tracker">
      <h2>Builder Tracker</h2>
      <div id="upgradeList"></div>
    </section>
    <section class="section" id="events">
      <h2>Events &amp; Updates</h2>
    </section>
    <section class="section" id="account">
      <h2>Your ClashVault Account</h2>
      <div id="authMethodScreen">
        <button id="authGameButton" type="button">Open with a game</button>
        <button id="authEmailButton" type="button">Log in with email</button>
      </div>
      <div id="authEmailScreen" hidden>
        <button id="authEmailBack" type="button">Back</button>
        <h3 id="authTitle">Create your account</h3>
        <form id="authEmailForm">
          <input id="authEmail" type="email" placeholder="Gmail address" autocomplete="email" required>
          <button id="authEmailSubmit" type="submit">Continue</button>
        </form>
        <button id="authModeToggle" type="button">Already have an account? Sign in</button>
      </div>
      <div id="authOtpScreen" hidden>
        <strong id="authPendingEmail"></strong>
        <form id="authOtpForm">
          <input id="authOtp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
          <button id="authVerifyButton" type="submit">Verify</button>
        </form>
        <button id="authResend" type="button">Resend code</button>
        <button id="authOtpBack" type="button">Back</button>
      </div>
      <div id="authLoggedIn" hidden>
        <h3 id="authUserName"></h3>
        <p id="authUserEmail"></p>
        <form id="playerLinkForm">
          <input id="authPlayerTag" maxlength="15" placeholder="Player Tag" required>
          <button id="authLinkPlayer" type="submit">Save Player Tag</button>
        </form>
        <p id="authPlayerStatus" aria-live="polite"></p>
        <button id="authLogout" type="button">Sign out</button>
      </div>
      <p id="authMessage" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./app.js"></script>
  <script src="./auth.js"></script>
  <script src="./clashvault-v4.js?v=4"></script>
</body>
</html>
